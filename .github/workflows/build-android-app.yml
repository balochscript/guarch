name: Build Android APK

on:
  push:
    branches: [Dev-1.0.1, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Go workspace
        run: |
          go work init
          go work use .
          go get golang.org/x/mobile@latest
          go mod tidy
          go mod download

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build AAR
        env:
          CGO_ENABLED: 1
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export GOWORK=off
          
          mkdir -p app/android/app/libs
          
          gomobile bind \
            -target=android \
            -androidapi 21 \
            -o app/android/app/libs/mobile.aar \
            -javapkg=com.guarch.mobile \
            -v \
            -work \
            github.com/balochscript/guarch/mobile
          
          ls -lh app/android/app/libs/mobile.aar

      - name: Flutter build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: app/build/app/outputs/flutter-apk/*arm64*.apk
