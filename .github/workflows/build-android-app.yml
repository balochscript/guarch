name: Build Android APK

on:
  push:
    branches: [Dev-1.0.1, main]
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-android-app.yml'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐹 Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: 🔧 Install Android NDK 25.2
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: 🦋 Setup Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 📦 Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: 🔧 Initialize gomobile
        run: gomobile init -v

      # ========== 🆕 این step کلیدیه ==========
      - name: 📥 Add gomobile to go.mod
        run: |
          go get golang.org/x/mobile@latest
          go mod tidy
          go mod download
          go mod verify
          echo "✅ golang.org/x/mobile added to go.mod"

      - name: 🏗️ Build Mobile AAR
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p app/android/app/libs
          
          gomobile bind \
            -target=android \
            -androidapi 21 \
            -o app/android/app/libs/mobile.aar \
            -javapkg=com.guarch.mobile \
            -v \
            ./mobile
          
          echo "✅ AAR created successfully"

      - name: ✅ Verify AAR
        run: |
          ls -lh app/android/app/libs/mobile.aar
          file app/android/app/libs/mobile.aar
          unzip -l app/android/app/libs/mobile.aar | head -20

      - name: 🎨 Prepare Icon
        run: |
          mkdir -p app/assets
          if [ -f icon.png ]; then
            cp icon.png app/assets/icon.png
            echo "✅ Icon copied"
          else
            echo "⚠️ No icon.png found"
          fi

      - name: 📚 Flutter Dependencies
        working-directory: app
        run: |
          flutter doctor -v
          flutter pub get

      - name: 🎨 Generate Launcher Icons
        working-directory: app
        run: |
          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            flutter pub run flutter_launcher_icons
            echo "✅ Icons generated"
          fi

      - name: 🚀 Build APK
        working-directory: app
        run: |
          if [ "${{ github.event.inputs.build_mode }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release --split-per-abi
          fi

      - name: 📝 Rename APKs
        run: |
          cd app/build/app/outputs/flutter-apk/
          
          VERSION=$(grep "^version:" ../../../../pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD=$(grep "^version:" ../../../../pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)
          
          for apk in app-*.apk; do
            [ -f "$apk" ] || continue
            NEW_NAME=$(echo $apk | sed "s/app-/guarch-v${VERSION}+${BUILD}-/")
            mv "$apk" "$NEW_NAME"
            echo "✅ $NEW_NAME ($(du -h "$NEW_NAME" | cut -f1))"
          done

      - name: 📤 Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: guarch-arm64-v8a
          path: app/build/app/outputs/flutter-apk/*-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: guarch-armeabi-v7a
          path: app/build/app/outputs/flutter-apk/*-armeabi-v7a-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 📤 Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: guarch-x86_64
          path: app/build/app/outputs/flutter-apk/*-x86_64-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 📦 Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d app/build/app/outputs/flutter-apk/ ]; then
            echo "### ✅ APK Files:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            
            cd app/build/app/outputs/flutter-apk/
            for apk in *.apk; do
              [ -f "$apk" ] || continue
              SIZE=$(du -h "$apk" | cut -f1)
              echo "| \`$apk\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check logs for errors" >> $GITHUB_STEP_SUMMARY
          fi
