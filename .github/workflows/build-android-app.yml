name: Build Android APK

on:
  push:
    branches: [Dev-1.0.1, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Go (باید با go.mod یکی باشد)
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Android SDK
      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      # Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      # ✅ Install gomobile (بدون go get)
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20240520174638-7b7b88c5b7c4
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20240520174638-7b7b88c5b7c4
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      # ✅ Build AAR (از ریشه پروژه)
      - name: Build mobile.aar
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p app/android/app/libs
          
          gomobile bind \
            -target=android \
            -androidapi=21 \
            -o app/android/app/libs/mobile.aar \
            -javapkg=com.guarch.mobile \
            guarch/mobile
          
          ls -lh app/android/app/libs/mobile.aar

      # Flutter build
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: app/build/app/outputs/flutter-apk/*arm64*.apk
