name: Build Android APK

on:
  push:
    branches: [Dev-1.0.1, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # ========== کلید اصلی: این قسمت ==========
      - name: Prepare Go workspace
        run: |
          # 1. اضافه کردن x/mobile به go.mod
          go get golang.org/x/mobile@latest
          
          # 2. اطمینان از resolve شدن همه dependencies
          go mod download
          
          # 3. ساخت یک dummy file که x/mobile/bind رو import کنه
          cat > /tmp/dummy.go << 'EOF'
          package main
          import _ "golang.org/x/mobile/bind"
          func main() {}
          EOF
          
          # 4. build کردن این dummy (برای force کردن resolve)
          go build -o /tmp/dummy /tmp/dummy.go || true
          
          # 5. حالا go mod tidy
          go mod tidy
          
          # 6. verify
          go list -m golang.org/x/mobile
          
          echo "✅ x/mobile prepared"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Build AAR
        env:
          CGO_ENABLED: 1
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          mkdir -p app/android/app/libs
          
          cd mobile
          gomobile bind \
            -target=android \
            -androidapi 21 \
            -o ../app/android/app/libs/mobile.aar \
            -javapkg=com.guarch.mobile \
            -v \
            .
          cd ..
          
          ls -lh app/android/app/libs/mobile.aar

      - name: Flutter build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: app/build/app/outputs/flutter-apk/*arm64*.apk
