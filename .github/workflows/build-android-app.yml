name: Build Android APK

on:
  push:
    branches: [Dev-1.0.1, main]
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐹 Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: 🔧 Install Android NDK
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: 🦋 Setup Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 🔧 Fix module path in go.mod
        run: |
          # Temporary fix: change module path to match current structure
          sed -i 's|^module guarch|module github.com/balochscript/guarch|' go.mod
          cat go.mod | head -5

      - name: 📥 Prepare Go modules
        run: |
          go get golang.org/x/mobile@latest
          go mod tidy
          go mod download
          go mod verify

      - name: 📦 Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init -v

      - name: 🏗️ Build Mobile AAR
        env:
          CGO_ENABLED: 1
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          mkdir -p app/android/app/libs
          
          cd mobile
          gomobile bind \
            -target=android \
            -androidapi 21 \
            -o ../app/android/app/libs/mobile.aar \
            -javapkg=com.guarch.mobile \
            -v \
            .
          cd ..
          
          ls -lh app/android/app/libs/mobile.aar
          file app/android/app/libs/mobile.aar

      - name: 🎨 Prepare Icon
        run: |
          mkdir -p app/assets
          [ -f icon.png ] && cp icon.png app/assets/icon.png || echo "No icon.png"

      - name: 📚 Flutter pub get
        working-directory: app
        run: |
          flutter doctor -v
          flutter pub get

      - name: 🎨 Generate Launcher Icons
        working-directory: app
        run: |
          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            flutter pub run flutter_launcher_icons || echo "Icon generation skipped"
          fi

      - name: 🚀 Build APK
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi --verbose

      - name: 📝 Rename APKs
        run: |
          cd app/build/app/outputs/flutter-apk/
          VERSION=$(grep "^version:" ../../../../pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD=$(grep "^version:" ../../../../pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)
          
          for apk in app-*.apk; do
            [ -f "$apk" ] || continue
            NEW_NAME=$(echo $apk | sed "s/app-/guarch-v${VERSION}+${BUILD}-/")
            mv "$apk" "$NEW_NAME"
            echo "✅ Renamed: $NEW_NAME ($(du -h "$NEW_NAME" | cut -f1))"
          done

      - name: 📤 Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: guarch-arm64-v8a
          path: app/build/app/outputs/flutter-apk/*-arm64-v8a-release.apk
          if-no-files-found: error

      - name: 📤 Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: guarch-armeabi-v7a
          path: app/build/app/outputs/flutter-apk/*-armeabi-v7a-release.apk
          if-no-files-found: warn

      - name: 📤 Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: guarch-x86_64
          path: app/build/app/outputs/flutter-apk/*-x86_64-release.apk
          if-no-files-found: warn

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d app/build/app/outputs/flutter-apk/ ]; then
            echo "### ✅ APK Files:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            
            cd app/build/app/outputs/flutter-apk/
            for apk in *.apk 2>/dev/null; do
              [ -f "$apk" ] || continue
              SIZE=$(du -h "$apk" | cut -f1)
              echo "| \`$apk\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "### ❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi
