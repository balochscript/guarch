name: Build Android APK

on:
  push:
    branches: [Dev-1.0.1, main]
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'pkg/**'
      - '.github/workflows/build-android-app.yml'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      # ========== Checkout Code ==========
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ========== Setup Java ==========
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ========== Setup Go ==========
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # ========== Setup Android SDK ==========
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      # ========== Setup Flutter ==========
      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ========== Setup Android NDK ==========
      - name: 🔧 Setup Android NDK
        run: |
          sdkmanager --install "ndk;25.1.8937393"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV

      # ========== Install gomobile ==========
      - name: 📦 Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # ========== Get mobile dependencies ==========
      - name: 📥 Get mobile bind package
        run: |
          go get golang.org/x/mobile/bind
          go get golang.org/x/mobile/cmd/gomobile
          go get golang.org/x/mobile/cmd/gobind

      # ========== Tidy Go modules ==========
      - name: 🧹 Tidy Go modules
        run: go mod tidy

      # ========== Init gomobile ==========
      - name: 🔧 Initialize gomobile
        run: |
          gomobile init
          echo "Gomobile initialized successfully"

      # ========== Build Go Mobile Library (AAR) ==========
      - name: 🏗️ Build Mobile AAR
        run: |
          mkdir -p app/android/app/libs
          gomobile bind \
            -target=android \
            -androidapi 21 \
            -o app/android/app/libs/mobile.aar \
            -javapkg=com.guarch.mobile \
            ./mobile

      - name: ✅ Verify AAR Created
        run: |
          ls -lh app/android/app/libs/mobile.aar
          echo "AAR size: $(du -h app/android/app/libs/mobile.aar | cut -f1)"

      # ========== Prepare App Icon ==========
      - name: 🎨 Prepare App Icon
        run: |
          mkdir -p app/assets
          if [ ! -f app/assets/icon.png ]; then
            if [ -f icon.png ]; then
              cp icon.png app/assets/icon.png
              echo "Copied icon.png to app/assets/"
            else
              echo "Warning: No icon.png found"
            fi
          fi

      # ========== Flutter Dependencies ==========
      - name: 📚 Get Flutter Dependencies
        working-directory: app
        run: flutter pub get

      # ========== Generate Launcher Icons ==========
      - name: 🎨 Generate Launcher Icons
        working-directory: app
        run: |
          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            flutter pub run flutter_launcher_icons
          fi

      # ========== Build APK (Release or Debug) ==========
      - name: 🚀 Build APK (${{ github.event.inputs.build_mode || 'release' }})
        working-directory: app
        run: |
          if [ "${{ github.event.inputs.build_mode }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release --split-per-abi
          fi

      # ========== Verify APK ==========
      - name: ✅ Verify APK Built
        run: |
          echo "=== APK Files ==="
          ls -lh app/build/app/outputs/flutter-apk/
          
          echo ""
          echo "=== APK Sizes ==="
          du -h app/build/app/outputs/flutter-apk/*.apk

      # ========== Rename APKs with Version ==========
      - name: 📝 Rename APKs
        run: |
          cd app/build/app/outputs/flutter-apk/
          
          VERSION=$(grep "^version:" ../../../../pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD=$(grep "^version:" ../../../../pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)
          
          for apk in app-*.apk; do
            if [ -f "$apk" ]; then
              NEW_NAME=$(echo $apk | sed "s/app-/guarch-v${VERSION}+${BUILD}-/")
              mv "$apk" "$NEW_NAME"
              echo "Renamed: $apk → $NEW_NAME"
            fi
          done
          
          ls -lh *.apk

      # ========== Upload ARM64 APK (Most Important) ==========
      - name: 📤 Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: guarch-arm64-apk
          path: app/build/app/outputs/flutter-apk/*-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      # ========== Upload Universal APK ==========
      - name: 📤 Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: guarch-universal-apk
          path: app/build/app/outputs/flutter-apk/guarch-*-release.apk
          if-no-files-found: warn
          retention-days: 30

      # ========== Upload ARMv7 APK ==========
      - name: 📤 Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: guarch-armeabi-apk
          path: app/build/app/outputs/flutter-apk/*-armeabi-v7a-release.apk
          if-no-files-found: warn
          retention-days: 30

      # ========== Create Build Summary ==========
      - name: 📊 Build Summary
        run: |
          echo "## 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 APK Files:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          
          cd app/build/app/outputs/flutter-apk/
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(du -h "$apk" | cut -f1)
              echo "| $apk | $SIZE |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Download:" >> $GITHUB_STEP_SUMMARY
          echo "Navigate to **Artifacts** section below" >> $GITHUB_STEP_SUMMARY
