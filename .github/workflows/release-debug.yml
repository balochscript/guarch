# .github/workflows/release-debug.yml
name: Release Debug Build

on:
  push:
    branches:
      - debug
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/release-debug.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  FLUTTER_VERSION: '3.16.0'
  JAVA_VERSION: '17'

jobs:
  build-android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      # Debug: بررسی Android SDK
      - name: Check Android SDK
        run: |
          echo "=== Android SDK Info ==="
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME: ${ANDROID_HOME}"
          ls -la ${ANDROID_SDK_ROOT}/ || echo "SDK root not found"
          echo ""
          echo "=== Available NDK versions ==="
          ls -la ${ANDROID_SDK_ROOT}/ndk/ 2>/dev/null || echo "No NDK directory"
      
      # نصب NDK
      - name: Install Android NDK
        run: |
          echo "=== Installing NDK ==="
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --list | grep ndk
          echo ""
          echo "Installing NDK 25.2.9519653..."
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          
          echo ""
          echo "=== Verifying NDK installation ==="
          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/25.2.9519653"
          if [ -d "$NDK_PATH" ]; then
            echo "✅ NDK installed at: $NDK_PATH"
            ls -la "$NDK_PATH" | head -10
          else
            echo "❌ NDK installation failed!"
            exit 1
          fi
          
          # تنظیم environment variables
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
      
      - name: Verify Go environment
        run: |
          echo "=== Go Environment ==="
          go version
          go env | grep -E "(GOPATH|GOROOT|GOCACHE|GOMODCACHE)"
          echo ""
          echo "=== Go Module ==="
          cat go.mod | head -20
          echo ""
          go list -m
      
      - name: Download Go dependencies
        run: |
          echo "=== Downloading dependencies ==="
          go mod download
          go mod verify
          echo ""
          echo "=== Key dependencies ==="
          go list -m all | grep -E "(mobile|quic|crypto|tun2socks)" || echo "No matching deps"
      
      - name: Install gomobile tools
        run: |
          echo "=== Installing gomobile ==="
          go install -v golang.org/x/mobile/cmd/gomobile@latest
          go install -v golang.org/x/mobile/cmd/gobind@latest
          
          GOBIN="$(go env GOPATH)/bin"
          echo "$GOBIN" >> $GITHUB_PATH
          
          echo ""
          echo "=== Verifying installation ==="
          ls -la "$GOBIN"/gomobile "$GOBIN"/gobind
          
          # تست اجرا
          "$GOBIN/gomobile" version || "$GOBIN/gomobile" help || echo "Gomobile installed"
      
      # Initialize gomobile با export صریح
      - name: Initialize gomobile
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/25.2.9519653"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export PATH="$(go env GOPATH)/bin:$PATH"
          
          echo "=== Environment Check ==="
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "PATH: $PATH"
          echo "Which gomobile: $(which gomobile)"
          echo ""
          
          echo "=== Initializing gomobile ==="
          gomobile init -v || gomobile init || {
            echo "❌ gomobile init failed"
            echo "Trying alternative initialization..."
            cd $(go env GOPATH)/pkg/gomobile
            ls -la || echo "gomobile pkg not found"
            exit 1
          }
          
          echo "✅ Gomobile initialized"
      
      - name: Verify mobile package
        run: |
          echo "=== Mobile Package ==="
          ls -la mobile/
          echo ""
          echo "=== Checking imports ==="
          head -50 mobile/mobile.go
          echo ""
          echo "=== Package info ==="
          go list -f '{{.Dir}}' guarch/mobile
          go list -f '{{.Imports}}' guarch/mobile || true
      
      - name: Build mobile.aar
        run: |
          set -e
          
          # تنظیم environment
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/25.2.9519653"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export PATH="$(go env GOPATH)/bin:$PATH"
          
          mkdir -p app/android/app/libs
          
          echo "=== Build Configuration ==="
          echo "PWD: $(pwd)"
          echo "Module: guarch"
          echo "Package: guarch/mobile"
          echo "Output: app/android/app/libs/mobile.aar"
          echo "NDK: $ANDROID_NDK_HOME"
          echo "Go: $(go version)"
          echo ""
          
          echo "=== Running gomobile bind ==="
          gomobile bind -v -x \
            -target=android \
            -androidapi=21 \
            -javapkg=com.guarch \
            -o app/android/app/libs/mobile.aar \
            -ldflags="-s -w" \
            guarch/mobile 2>&1 | tee build.log
          
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ Build failed with exit code: $BUILD_EXIT_CODE"
            echo ""
            echo "=== Build log ==="
            cat build.log
            exit 1
          fi
          
          echo ""
          echo "✅ Build completed successfully"
      
      - name: Verify AAR
        run: |
          AAR_PATH="app/android/app/libs/mobile.aar"
          
          if [ ! -f "$AAR_PATH" ]; then
            echo "❌ mobile.aar not found at: $AAR_PATH"
            echo ""
            echo "Directory listing:"
            find app/android/app/libs -type f
            echo ""
            echo "Build log:"
            cat build.log 2>/dev/null || echo "No build log"
            exit 1
          fi
          
          echo "✅ mobile.aar created successfully"
          echo ""
          echo "File info:"
          ls -lh "$AAR_PATH"
          echo ""
          echo "AAR contents:"
          unzip -l "$AAR_PATH" | head -40
      
      - name: Get Flutter dependencies
        working-directory: app
        run: |
          flutter pub get
          flutter pub upgrade
      
      - name: Flutter doctor
        run: flutter doctor -v
      
      - name: Generate build number
        id: build_number
        run: |
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          BUILD_NAME="0.1.0-debug+$BUILD_NUMBER"
          
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_OUTPUT
          
          echo "Build: $BUILD_NUMBER"
          echo "Version: $BUILD_NAME"
      
      - name: Build Flutter APK
        working-directory: app
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.BUILD_NUMBER }}
          BUILD_NAME: ${{ steps.build_number.outputs.BUILD_NAME }}
        run: |
          echo "=== Building APK ==="
          flutter build apk \
            --debug \
            --build-number=$BUILD_NUMBER \
            --build-name=$BUILD_NAME \
            --verbose
      
      - name: Verify and rename APK
        id: apk_info
        run: |
          APK_ORIG="app/build/app/outputs/flutter-apk/app-debug.apk"
          APK_NAME="guarch-debug-${{ steps.build_number.outputs.BUILD_NUMBER }}.apk"
          APK_NEW="app/build/app/outputs/flutter-apk/$APK_NAME"
          
          if [ ! -f "$APK_ORIG" ]; then
            echo "❌ APK not found!"
            find app/build -name "*.apk"
            exit 1
          fi
          
          mv "$APK_ORIG" "$APK_NEW"
          
          APK_SIZE=$(du -h "$APK_NEW" | cut -f1)
          
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK_NAME=$APK_NAME" >> $GITHUB_OUTPUT
          
          echo "✅ APK: $APK_NAME ($APK_SIZE)"
      
      - name: Generate checksums
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          sha256sum guarch-debug-*.apk | tee checksums.txt
          md5sum guarch-debug-*.apk | tee -a checksums.txt
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guarch-debug-${{ steps.build_number.outputs.BUILD_NUMBER }}
          path: |
            app/build/app/outputs/flutter-apk/guarch-debug-*.apk
            app/build/app/outputs/flutter-apk/checksums.txt
          retention-days: 30
          if-no-files-found: error
      
      - name: Create release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: debug-${{ steps.build_number.outputs.BUILD_NUMBER }}
          name: "🚧 Debug Build ${{ steps.build_number.outputs.BUILD_NUMBER }}"
          body: |
            ## 🚧 Guarch Debug Build
            
            **Build:** `${{ steps.build_number.outputs.BUILD_NUMBER }}`  
