# .github/workflows/release-debug.yml
name: Release Debug Build

on:
  push:
    branches:
      - debug
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/release-debug.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  FLUTTER_VERSION: '3.16.0'
  JAVA_VERSION: '17'

jobs:
  build-android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      # اصلاح شده: نصب NDK و تنظیم environment
      - name: Set up Android NDK
        run: |
          echo "Installing Android NDK..."
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          
          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/25.2.9519653"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          
          echo "NDK installed at: $NDK_PATH"
          ls -la "$NDK_PATH" || echo "NDK directory not found!"
      
      - name: Verify Go module
        run: |
          echo "=== Go Module Info ==="
          go version
          cat go.mod | head -20
          echo ""
          echo "Module: $(go list -m)"
      
      - name: Download Go dependencies
        run: |
          go mod download
          go mod verify
          echo ""
          echo "=== Mobile Dependencies ==="
          go list -m all | grep -E "(mobile|quic|tun2socks)" || echo "No mobile deps found"
      
      - name: Install gomobile
        run: |
          echo "Installing gomobile..."
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          
          echo "Gomobile installed at: $(go env GOPATH)/bin/gomobile"
      
      # اصلاح شده: gomobile init بدون -ndk flag
      - name: Initialize gomobile
        run: |
          echo "Initializing gomobile..."
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "ANDROID_HOME: $ANDROID_HOME"
          
          # gomobile از environment variable استفاده می‌کنه
          gomobile init
          
          echo "Gomobile initialized successfully"
      
      - name: Verify mobile package
        run: |
          echo "=== Mobile Package Structure ==="
          ls -la mobile/
          echo ""
          echo "=== Mobile Package Imports ==="
          head -40 mobile/mobile.go | grep -E "^import|^\t\"" || true
          echo ""
          echo "=== Exported Types ==="
          go doc guarch/mobile | head -20 || echo "No docs yet"
      
      - name: Build Go mobile library
        run: |
          set -e
          mkdir -p app/android/app/libs
          
          echo "=== Building mobile.aar ==="
          echo "Working directory: $(pwd)"
          echo "Module: guarch"
          echo "Package: guarch/mobile"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "GOPATH: $(go env GOPATH)"
          echo ""
          
          # Build AAR
          gomobile bind -v \
            -target=android \
            -androidapi=21 \
            -javapkg=com.guarch \
            -o app/android/app/libs/mobile.aar \
            -ldflags="-s -w" \
            guarch/mobile
          
          echo ""
          echo "=== Build Result ==="
          ls -lh app/android/app/libs/mobile.aar
      
      - name: Verify AAR file
        run: |
          AAR_FILE="app/android/app/libs/mobile.aar"
          
          if [ ! -f "$AAR_FILE" ]; then
            echo "❌ ERROR: mobile.aar not created!"
            echo ""
            echo "Directory contents:"
            find app/android/app/libs -type f || echo "No files found"
            exit 1
          fi
          
          echo "✅ mobile.aar created successfully"
          echo ""
          
          FILE_SIZE=$(du -h "$AAR_FILE" | cut -f1)
          echo "File size: $FILE_SIZE"
          echo ""
          
          echo "AAR contents (first 30 entries):"
          unzip -l "$AAR_FILE" | head -30
      
      - name: Get Flutter dependencies
        working-directory: app
        run: |
          echo "Getting Flutter dependencies..."
          flutter pub get
          flutter pub upgrade
      
      - name: Run Flutter doctor
        run: flutter doctor -v
      
      - name: Generate build number
        id: build_number
        run: |
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          BUILD_NAME="0.1.0-debug+$BUILD_NUMBER"
          
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_OUTPUT
          
          echo ""
          echo "Build Number: $BUILD_NUMBER"
          echo "Build Name: $BUILD_NAME"
      
      - name: Build Android Debug APK
        working-directory: app
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.BUILD_NUMBER }}
          BUILD_NAME: ${{ steps.build_number.outputs.BUILD_NAME }}
        run: |
          echo "=== Building Flutter APK ==="
          echo "Build number: $BUILD_NUMBER"
          echo "Build name: $BUILD_NAME"
          echo ""
          
          flutter build apk \
            --debug \
            --build-number=$BUILD_NUMBER \
            --build-name=$BUILD_NAME \
            --verbose
      
      - name: List build outputs
        run: |
          echo "=== Build Outputs ==="
          find app/build/app/outputs -type f \( -name "*.apk" -o -name "*.aab" \) || echo "No APK/AAB found"
      
      - name: Rename and verify APK
        id: apk_info
        run: |
          APK_ORIG="app/build/app/outputs/flutter-apk/app-debug.apk"
          APK_NAME="guarch-debug-${{ steps.build_number.outputs.BUILD_NUMBER }}.apk"
          APK_NEW="app/build/app/outputs/flutter-apk/$APK_NAME"
          
          if [ ! -f "$APK_ORIG" ]; then
            echo "❌ ERROR: APK not found at $APK_ORIG"
            echo ""
            echo "Available files:"
            ls -la app/build/app/outputs/flutter-apk/ || echo "Directory not found"
            exit 1
          fi
          
          mv "$APK_ORIG" "$APK_NEW"
          
          # Get file size (cross-platform)
          if command -v stat &> /dev/null; then
            APK_SIZE=$(du -h "$APK_NEW" | cut -f1)
            APK_SIZE_BYTES=$(stat -c%s "$APK_NEW" 2>/dev/null || stat -f%z "$APK_NEW")
          else
            APK_SIZE="Unknown"
            APK_SIZE_BYTES="0"
          fi
          
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK_SIZE_BYTES=$APK_SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "APK_NAME=$APK_NAME" >> $GITHUB_OUTPUT
          
          echo "✅ APK created successfully"
          echo "   Name: $APK_NAME"
          echo "   Size: $APK_SIZE"
      
      - name: Generate checksums
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          echo "=== Generating Checksums ==="
          sha256sum guarch-debug-*.apk | tee checksums.txt
          md5sum guarch-debug-*.apk | tee -a checksums.txt
          echo ""
          echo "Checksums saved to checksums.txt"
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guarch-android-debug-apk-${{ steps.build_number.outputs.BUILD_NUMBER }}
          path: |
            app/build/app/outputs/flutter-apk/guarch-debug-*.apk
            app/build/app/outputs/flutter-apk/checksums.txt
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      
      - name: Create release notes
        run: |
          cat > release_notes.md << 'NOTES'
          ## 🚧 Guarch Protocol Suite - Debug Build
          
          **⚠️ DEBUG BUILD - For Testing Only!**
          
          ### 📦 What's Inside
          
          Three protocols for different scenarios:
          
          | Protocol | Transport | Best For | Emoji |
          |----------|-----------|----------|-------|
          | **Guarch** | TLS 1.3 / TCP | Maximum stealth with cover traffic | 🏹 |
          | **Grouk** | Raw UDP | Maximum speed with AIMD control | 🌩️ |
          | **Zhip** | QUIC | Balanced with 0-RTT resumption | ⚡ |
          
          ### 🔧 Build Info
          
          ```
          Build:    ${{ steps.build_number.outputs.BUILD_NUMBER }}
          Version:  ${{ steps.build_number.outputs.BUILD_NAME }}
          Size:     ${{ steps.apk_info.outputs.APK_SIZE }}
          Commit:   ${{ github.sha }}
          Branch:   debug
          Date:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ```
          
          ### 🧪 Please Test
          
          - [ ] All three protocols (Guarch, Grouk, Zhip)
          - [ ] Server import/export (URI + JSON)
          - [ ] Background VPN service
          - [ ] Network switching (WiFi ↔ Mobile)
          - [ ] Battery & memory usage
          - [ ] Connection stability
          
          ### 📥 Installation
          
          **Download APK** from Assets below, then:
          
          ```bash
          # Via ADB
          adb install guarch-debug-${{ steps.build_number.outputs.BUILD_NUMBER }}.apk
          
          # View logs
          adb logcat | grep -E "(Guarch|Flutter)"
          ```
          
          ### 🔐 Checksums
          
          Verify your download:
          ```
          $(cat app/build/app/outputs/flutter-apk/checksums.txt)
          ```
          
          ### 🐛 Found a Bug?
          
          Report at: https://github.com/${{ github.repository }}/issues
          
          Include:
          - Device model & Android version
          - Build number: `${{ steps.build_number.outputs.BUILD_NUMBER }}`
          - Steps to reproduce
          - Logs from the app
          
          ### ⚠️ Security Warning
          
          This is a **DEBUG BUILD** with:
          - Debug symbols (easier reverse engineering)
          - Verbose logging (may expose data)
          - NOT optimized for production
          
          **Do NOT use for sensitive activities!**
          
          ### 🙏 Thank You
          
          Your testing helps make Guarch better!
          
          ---
          Built with 🏹🌩️⚡ by the community
          NOTES
      
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: debug-${{ steps.build_number.outputs.BUILD_NUMBER }}
          name: "🚧 Debug ${{ steps.build_number.outputs.BUILD_NUMBER }}"
          body_path: release_notes.md
          draft: false
          prerelease: true
          files: |
            app/build/app/outputs/flutter-apk/guarch-debug-*.apk
            app/build/app/outputs/flutter-apk/checksums.txt
          fail_on_unmatched_files: true
      
      - name: Comment on commit
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            ## ✅ Debug Build Ready!
            
            **Build:** `${{ steps.build_number.outputs.BUILD_NUMBER }}`  
            **Size:** `${{ steps.apk_info.outputs.APK_SIZE }}`  
            **Protocols:** 🏹 Guarch + 🌩️ Grouk + ⚡ Zhip
            
            ### 📱 [Download APK](${{ steps.create_release.outputs.url }})
            
            ### 🔐 Checksums
            ```
            $(cat app/build/app/outputs/flutter-apk/checksums.txt)
            ```
            
            Happy testing! 🧪
      
      - name: Create summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY'
          ## ✅ Build Successful!
          
          ### 📦 Artifacts
          - **APK:** `${{ steps.apk_info.outputs.APK_NAME }}`
          - **Size:** `${{ steps.apk_info.outputs.APK_SIZE }}`
          - **Build:** `${{ steps.build_number.outputs.BUILD_NUMBER }}`
          
          ### 📱 Download
          [Release Page](${{ steps.create_release.outputs.url }})
          
          ### 🔐 Checksums
          ```
          $(cat app/build/app/outputs/flutter-apk/checksums.txt)
          ```
          SUMMARY
      
      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.build_number.outputs.BUILD_NUMBER }}
          path: |
            app/build/app/outputs/logs/
            ~/.gradle/daemon/*/daemon-*.out.log
          if-no-files-found: ignore
          retention-days: 7
