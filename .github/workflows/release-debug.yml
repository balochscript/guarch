# .github/workflows/release-debug.yml
name: Release Debug Build

on:
  push:
    branches:
      - debug
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'pkg/**'
      - 'cmd/**'
      - '.github/workflows/release-debug.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  FLUTTER_VERSION: '3.16.0'
  JAVA_VERSION: '17'

jobs:
  build-android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
      
      - name: Cache Go mobile dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/go/pkg/gomobile
          key: ${{ runner.os }}-gomobile-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomobile-
      
      - name: Build Go mobile library
        run: |
          mkdir -p app/android/app/libs
          gomobile bind -target=android -androidapi 21 \
            -o app/android/app/libs/mobile.aar \
            -ldflags="-s -w" \
            ./mobile/
      
      - name: Get Flutter dependencies
        working-directory: app
        run: flutter pub get
      
      - name: Run Flutter analyzer
        working-directory: app
        run: flutter analyze --no-fatal-infos
      
      - name: Generate build number
        id: build_number
        run: |
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "BUILD_NAME=0.1.0-debug+$BUILD_NUMBER" >> $GITHUB_OUTPUT
      
      - name: Build Android Debug APK
        working-directory: app
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.BUILD_NUMBER }}
        run: |
          flutter build apk \
            --debug \
            --build-number=$BUILD_NUMBER \
            --build-name=${{ steps.build_number.outputs.BUILD_NAME }}
      
      - name: Build Android Debug App Bundle
        working-directory: app
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.BUILD_NUMBER }}
        run: |
          flutter build appbundle \
            --debug \
            --build-number=$BUILD_NUMBER \
            --build-name=${{ steps.build_number.outputs.BUILD_NAME }}
      
      - name: Rename APK
        run: |
          mv app/build/app/outputs/flutter-apk/app-debug.apk \
             app/build/app/outputs/flutter-apk/guarch-debug-${{ steps.build_number.outputs.BUILD_NUMBER }}.apk
      
      - name: Generate checksums
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          sha256sum guarch-debug-${{ steps.build_number.outputs.BUILD_NUMBER }}.apk > checksums.txt
          md5sum guarch-debug-${{ steps.build_number.outputs.BUILD_NUMBER }}.apk >> checksums.txt
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guarch-android-debug-apk
          path: |
            app/build/app/outputs/flutter-apk/guarch-debug-*.apk
            app/build/app/outputs/flutter-apk/checksums.txt
          retention-days: 30
      
      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: guarch-android-debug-aab
          path: app/build/app/outputs/bundle/debug/app-debug.aab
          retention-days: 30
      
      - name: Create Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## 🚧 Guarch Protocol Suite - Debug Build
          
          **⚠️ WARNING: This is a DEBUG build for testing purposes only!**
          
          ### What is this?
          This is an early debug build of the Guarch Android app. It includes:
          - 🏹 Guarch (TLS/TCP) protocol support
          - 🌩️ Grouk (Raw UDP) protocol support
          - ⚡ Zhip (QUIC) protocol support
          - System-wide VPN functionality
          - Real-time statistics and logs
          
          ### Debug Build Information
          - **Build Number:** ${{ steps.build_number.outputs.BUILD_NUMBER }}
          - **Build Name:** ${{ steps.build_number.outputs.BUILD_NAME }}
          - **Commit:** ${{ github.sha }}
          - **Branch:** debug
          
          ### ⚠️ Known Issues
          - Debug symbols included (larger APK size ~50MB)
          - Verbose logging enabled (may impact performance)
          - Not optimized for production use
          - May contain experimental features
          
          ### 📝 Testing Checklist
          Please test and report:
          - [ ] VPN connection establishment
          - [ ] Protocol switching (Guarch/Grouk/Zhip)
          - [ ] Server import/export
          - [ ] Real-time stats accuracy
          - [ ] Battery usage
          - [ ] Any crashes or freezes
          
          ### 🐛 Report Issues
          Found a bug? Please report at:
          https://github.com/balochscript/guarch/issues
          
          Include:
          - Android version
          - Device model
          - Steps to reproduce
          - Connection logs (if possible)
          
          ### 📦 Installation
          ```bash
          # Download APK
          wget https://github.com/balochscript/guarch/releases/download/debug-${{ steps.build_number.outputs.BUILD_NUMBER }}/guarch-debug-${{ steps.build_number.outputs.BUILD_NUMBER }}.apk
          
          # Verify checksum
          sha256sum guarch-debug-${{ steps.build_number.outputs.BUILD_NUMBER }}.apk
          
          # Install
          adb install guarch-debug-${{ steps.build_number.outputs.BUILD_NUMBER }}.apk
          ```
          
          ### 🔐 Security Note
          This debug build includes:
          - Debug symbols and logging
          - No certificate pinning for localhost testing
          - Relaxed security checks
          
          **DO NOT use for production or sensitive activities!**
          
          ### 📊 File Information
          - **APK Size:** ~50-60 MB (debug symbols included)
          - **Min Android:** 5.0 (API 21)
          - **Target Android:** 14 (API 34)
          
          ### 🙏 Thank You
          Your testing and feedback help make Guarch better!
          
          ---
          
          Built with 🏹🌩️⚡ | Hidden like a Balochi hunter
          EOF
          
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: debug-${{ steps.build_number.outputs.BUILD_NUMBER }}
          name: "Debug Build ${{ steps.build_number.outputs.BUILD_NUMBER }}"
          body_path: release_notes.md
          draft: false
          prerelease: true
          files: |
            app/build/app/outputs/flutter-apk/guarch-debug-*.apk
            app/build/app/outputs/flutter-apk/checksums.txt
      
      - name: Comment on commit
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            ## ✅ Debug Build Created Successfully!
            
            **Build:** `${{ steps.build_number.outputs.BUILD_NUMBER }}`
            
            📦 [Download APK](https://github.com/${{ github.repository }}/releases/tag/debug-${{ steps.build_number.outputs.BUILD_NUMBER }})
            
            **Checksums:**
            ```
            $(cat app/build/app/outputs/flutter-apk/checksums.txt)
            ```

  notify-discord:
    name: Notify Discord
    needs: build-android-debug
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Send Discord notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Guarch Debug Build"
          description: |
            Debug build ${{ needs.build-android-debug.outputs.BUILD_NUMBER }} completed!
            
            **Status:** ${{ job.status }}
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
          color: 0x00ff00
          username: Guarch Bot
          avatar_url: https://github.com/balochscript.png

  notify-telegram:
    name: Notify Telegram
    needs: build-android-debug
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🏹 Guarch Debug Build Ready!
            
            Build: ${{ needs.build-android-debug.outputs.BUILD_NUMBER }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            Download: https://github.com/${{ github.repository }}/releases/tag/debug-${{ needs.build-android-debug.outputs.BUILD_NUMBER }}
