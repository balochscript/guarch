# .github/workflows/release-debug.yml
name: Release Debug Build

on:
  push:
    branches:
      - debug
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/release-debug.yml'
  workflow_dispatch:

env:
  # VVVVVV VVVVVV
  GO_VERSION: '1.24' 
  FLUTTER_VERSION: '3.22.2' # 
  JAVA_VERSION: '17'

jobs:
  build-android-debug:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Install Android NDK
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" --sdk_root=${ANDROID_SDK_ROOT}
          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/25.2.9519653"
          if [ ! -d "$NDK_PATH" ]; then echo "❌ NDK installation failed!"; exit 1; fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          
      - name: Download Go dependencies
        run: go mod download

      - name: Install gomobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # VVVVVV
      - name: Get gomobile dependencies
        run: |
          echo "Getting required gomobile packages..."
          go get golang.org/x/mobile/bind
          go get golang.org/x/mobile/bind/java
          go get golang.org/x/mobile/bind/objc

      - name: Initialize gomobile
        run: gomobile init -v
          
      - name: Build mobile.aar
        run: |
          set -e
          mkdir -p app/android/app/libs
          
          # 
          gomobile bind -v -x \
            -target=android \
            -androidapi=21 \
            -javapkg=com.guarch \
            -o app/android/app/libs/mobile.aar \
            -ldflags="-s -w" \
            guarch/mobile
            
      - name: Verify AAR
        run: |
          if [ ! -f "app/android/app/libs/mobile.aar" ]; then
            echo "❌ mobile.aar not found!"
            exit 1
          fi
          echo "✅ mobile.aar created successfully."
          ls -lh app/android/app/libs/mobile.aar
          
      - name: Get Flutter dependencies
        working-directory: app
        run: flutter pub get
      
      - name: Generate build info
        id: build_info
        run: |
          # VVVVVV این خط را تغییر دهید VVVVVV
          BUILD_NUMBER=$(date +%s)
          # ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "BUILD_NAME=0.1.0-debug+$BUILD_NUMBER" >> $GITHUB_OUTPUT
          
          echo "Build Number: $BUILD_NUMBER"
          echo "Build Name: 0.1.0-debug+$BUILD_NUMBER"
          
      - name: Build Flutter APK
        working-directory: app
        run: |
          flutter build apk \
            --debug \
            --build-number=${{ steps.build_info.outputs.BUILD_NUMBER }} \
            --build-name=${{ steps.build_info.outputs.BUILD_NAME }} \
            --verbose
            
      - name: Prepare release files
        id: prep_release
        run: |
          APK_DIR="app/build/app/outputs/flutter-apk"
          APK_ORIG="$APK_DIR/app-debug.apk"
          if [ ! -f "$APK_ORIG" ]; then echo "❌ APK not found!"; exit 1; fi
          
          APK_NAME="guarch-debug-${{ steps.build_info.outputs.BUILD_NUMBER }}.apk"
          mv "$APK_ORIG" "$APK_DIR/$APK_NAME"
          
          cd $APK_DIR
          sha256sum $APK_NAME > checksums.txt
          md5sum $APK_NAME >> checksums.txt
          cd -
          
          echo "APK_PATH=$APK_DIR/$APK_NAME" >> $GITHUB_OUTPUT
          echo "CHECKSUMS_PATH=$APK_DIR/checksums.txt" >> $GITHUB_OUTPUT
          echo "APK_NAME=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ steps.build_info.outputs.BUILD_NUMBER }}
          name: "🚧 Debug Build ${{ steps.build_info.outputs.BUILD_NUMBER }}"
          body: |
            ## 🚧 Guarch Debug Build
            
            This is an automated debug build generated by GitHub Actions.
            - **Version:** `${{ steps.build_info.outputs.BUILD_NAME }}`
            
            ### Files
            - `${{ steps.prep_release.outputs.APK_NAME }}`
          files: |
            ${{ steps.prep_release.outputs.APK_PATH }}
            ${{ steps.prep_release.outputs.CHECKSUMS_PATH }}
          prerelease: true
