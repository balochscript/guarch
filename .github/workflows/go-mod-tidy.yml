name: Go Mod Tidy

on:
  push:
    branches: [ Dev-1.0.1 ]
    paths:
      - 'go.mod'
      - '**.go'

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Go mod download
        run: |
          go mod download
          go mod verify
      
      - name: Go mod tidy
        run: go mod tidy
      
      - name: Commit go.sum if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -n $(git status -s go.sum) ]]; then
            git add go.sum
            git commit -m "chore: update go.sum [skip ci]"
            git push
          fi
